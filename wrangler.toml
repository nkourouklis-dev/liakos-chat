name = "liakos-chat"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "Liakos Chat"
ALLOWED_ORIGIN_SUFFIX = ".pages.dev"

[dev]
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "liakos_db"
database_id = "9c71d5d1-c78b-4f30-a6fa-57b855ed6bc9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "liakos-media"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]